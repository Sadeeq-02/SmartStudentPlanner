<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Big Dollar University</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>🎓 Big Dollar University</h1>

        <h2>Reset Password</h2>

        <form method="POST">

            <label for="register_number">
                Register Number
            </label>

            <input
                type="text"
                name="register_number"
                id="register_number"
                required
            >

            <label for="new_password">
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                id="new_password"
                required
            >

            <label for="confirm_password">
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p>
            <a href="/login">← Back to Login</a>
        </p>

    </div>

</body>
</html>
